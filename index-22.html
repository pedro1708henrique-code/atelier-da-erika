<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ateliê da Érica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#F5E2D4; --ink:#1A1512; --rose:#B5636B; --sage:#7C8B6F; --gold:#C9A24B;
    --card-bg:#FFFFFF; --line:#E6C7A6; --muted:#7A6A5B; --icon:#8B7362;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html { scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
  * { box-sizing:border-box; }
  body {
    margin:0; height:100%; background:var(--cream); color:var(--ink);
    font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3 { font-family:'Poppins',sans-serif; font-weight:700; margin:0; }
  button { font-family:inherit; cursor:pointer; }

  header {
    position:sticky; top:0; z-index:20; background:var(--cream);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 14px;
    border-bottom:1px solid var(--line);
  }
  .at-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .at-logo { display:flex; align-items:center; gap:10px; }
  .at-logo-badge {
    width:88px; height:88px; border-radius:50%; overflow:hidden; flex:0 0 auto;
    border:1px solid var(--line); background:#FBEFE4;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-top:6px;
  }
  .at-logo-badge svg { width:32px; height:32px; flex:0 0 auto; }
  .at-logo-badge-text { text-align:center; line-height:1.1; margin-top:2px; }
  .at-logo-badge-text .l1 { display:block; font-family:'Poppins',sans-serif; font-weight:600; font-size:8px; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  .at-logo-badge-text .l2 { display:block; font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.01em; color:var(--rose); }
  .at-icons { display:flex; gap:18px; align-items:center; }
  .at-icon-btn { background:none; border:none; position:relative; padding:4px; color:var(--icon); }
  .at-icon-btn svg { width:24px; height:24px; display:block; }
  .at-count { position:absolute; top:-2px; right:-2px; background:var(--rose); color:#fff; font-size:10px; min-width:16px; height:16px; border-radius:8px; display:flex; align-items:center; justify-content:center; padding:0 3px; }
  .at-tagline { text-align:center; font-weight:700; font-size:15px; line-height:1.5; padding:16px 12px 4px; max-width:640px; margin:0 auto; }
  .at-banner { margin:16px 0 0; height:150px; background:linear-gradient(135deg,#EAC9AC,#F6E2CE); position:relative; overflow:hidden; }
  .at-banner svg { position:absolute; inset:0; width:100%; height:100%; }
  .at-banner img { width:100%; height:100%; object-fit:cover; display:block; }
  .at-cat-heading { font-size:30px; margin:18px 0 14px; text-align:center; }

  .at-menu { display:flex; gap:8px; margin-top:14px; overflow-x:auto; padding-bottom:2px; }
  .at-menu button {
    flex:0 0 auto; background:none; border:1px solid var(--line); color:var(--ink);
    padding:7px 14px; border-radius:2px; font-size:13.5px; white-space:nowrap;
  }
  .at-menu button.active { background:var(--ink); color:var(--cream); border-color:var(--ink); }

  .at-search-wrap { padding:14px 20px 0; }
  #searchInput {
    width:100%; border:1px solid var(--line); background:var(--card-bg); color:var(--ink);
    padding:10px 12px; border-radius:2px; font-size:14px; font-family:inherit;
  }

  main { padding:18px 20px 60px; max-width:960px; margin:0 auto; }
  #products {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:18px 14px;
  }
  .at-card { display:flex; flex-direction:column; position:relative; }
  .at-photo { width:100%; aspect-ratio:1; background:var(--card-bg); border:1px solid var(--line); border-radius:3px; overflow:hidden; margin-bottom:8px; position:relative; }
  .at-photo img { width:100%; height:100%; object-fit:cover; display:block; }
  .at-card h3 { font-size:15px; font-weight:500; line-height:1.3; }
  .at-cat { font-size:11.5px; color:var(--muted); margin:2px 0 4px; }
  .at-price { font-size:14.5px; color:var(--rose); font-family:'Poppins',sans-serif; }
  .at-card .at-btn {
    margin-top:8px; background:none; border:1px solid var(--ink); color:var(--ink);
    padding:7px; font-size:13px; border-radius:2px; font-family:inherit; font-weight:400;
  }
  .at-empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:40px 0; font-size:14px; }

  .at-modal-bg {
    display:none; position:fixed; inset:0; background:rgba(30,22,17,.45); z-index:50;
    align-items:flex-end; justify-content:center;
  }
  @media (min-width:640px) { .at-modal-bg { align-items:center; } }
  .at-modal {
    background:var(--cream); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:8px 8px 0 0; padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));
    position:relative;
  }
  @media (min-width:640px) { .at-modal { border-radius:8px; } }
  .at-close { position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--muted); line-height:1; padding:4px; }
  .at-modal h2 { font-size:20px; margin-bottom:4px; padding-right:24px; }

  .at-gallery-thumbs { display:flex; gap:8px; margin-top:8px; }
  .at-gallery-thumbs button { width:44px; height:44px; padding:0; border-radius:3px; overflow:hidden; border:2px solid var(--line); background:var(--card-bg); }
  .at-gallery-thumbs button.active { border-color:var(--rose); }
  .at-gallery-thumbs img { width:100%; height:100%; object-fit:cover; display:block; }
  .at-gallery-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.85); border:none; width:30px; height:30px; border-radius:50%; font-size:16px; color:var(--ink); display:flex; align-items:center; justify-content:center; }
  .at-gallery-nav.prev { left:8px; } .at-gallery-nav.next { right:8px; }

  .at-cart-item { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .at-cart-item img { width:48px; height:48px; object-fit:cover; border-radius:3px; border:1px solid var(--line); }
  .at-cart-item .info { flex:1; min-width:0; }
  .at-cart-item .info div:first-child { font-size:14px; }
  .at-cart-item .info div:last-child { font-size:12.5px; color:var(--muted); }
  .at-remove { background:none; border:none; color:var(--rose); font-size:13px; }
  .at-cart-total { display:flex; justify-content:space-between; font-family:'Poppins',sans-serif; font-size:18px; margin:14px 0; }
  .at-wa-btn {
    display:block; width:100%; text-align:center; background:#3F7C5A; color:#fff; text-decoration:none;
    padding:13px; border-radius:4px; font-size:14.5px; font-weight:500;
  }
  .at-cart-empty { color:var(--muted); font-size:14px; padding:16px 0; }
  .at-primary-btn { width:100%; margin-top:16px; background:var(--ink); color:var(--cream); border:none; padding:11px; border-radius:3px; font-size:14.5px; }
  .at-note { font-size:12px; color:var(--muted); margin-top:14px; line-height:1.5; }
</style>
</head>
<body>
<div id="atelieDelicado">

  <header>
    <div class="at-top">
      <div class="at-logo">
        <div class="at-logo-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="#B5636B" stroke-width="1.3">
            <path d="M12 12c0-3 2-6 5-6 2 0 3 1.5 3 3.2 0 2.6-2.6 3.8-5 3.8"/>
            <path d="M12 12c0-3-2-6-5-6-2 0-3 1.5-3 3.2 0 2.6 2.6 3.8 5 3.8"/>
            <path d="M12 12c0 3 2 6 5 6 2 0 3-1.5 3-3.2 0-2.6-2.6-3.8-5-3.8"/>
            <path d="M12 12c0 3-2 6-5 6-2 0-3-1.5-3-3.2 0-2.6 2.6-3.8 5-3.8"/>
            <line x1="12" y1="6" x2="12" y2="18"/>
          </svg>
          <div class="at-logo-badge-text">
            <span class="l1">Ateliê</span>
            <span class="l2">da Érica</span>
          </div>
        </div>
      </div>
      <div class="at-icons">
        <a class="at-icon-btn" href="https://wa.me/5582993492814" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21l1.4-4.2A8.5 8.5 0 1 1 8 20.3L3 21z"/><path d="M8.5 9.5c0 3 2.5 5.5 5.5 5.5.6 0 1-.4.9-1l-.3-1.2c-.1-.4-.5-.6-.9-.5l-1 .3c-1-.6-1.8-1.4-2.4-2.4l.3-1c.1-.4-.1-.8-.5-.9L9 8c-.6-.1-1 .3-1 .9z" fill="currentColor" stroke="none"/></svg>
        </a>
        <a class="at-icon-btn" href="https://www.instagram.com/atelie_da_erika/" id="instagramBtn" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>
        </a>
        <button class="at-icon-btn" id="cartIconBtn" aria-label="Carrinho">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.5 3h2l2.4 12.4a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>
          <span class="at-count" id="cartCount" style="display:none">0</span>
        </button>
      </div>
    </div>
    <nav class="at-menu">
      <button data-cat="Todos" class="active">Todos</button>
      <button data-cat="Bolsa">Bolsa</button>
      <button data-cat="Naninha">Naninha</button>
      <button data-cat="Toalhas">Toalhas</button>
      <button data-cat="Mantas">Mantas</button>
    </nav>
  </header>

  <p class="at-tagline">Desde 2015, criando peças especiais com delicadeza, cuidado e dedicação para momentos que merecem ser eternizados</p>

  <div class="at-banner" id="atBanner">
    <svg viewBox="0 0 400 150" preserveAspectRatio="xMidYMid slice" id="bannerDefaultSvg">
      <circle cx="60" cy="115" r="70" fill="#DDB596" opacity=".5"/>
      <circle cx="340" cy="20" r="80" fill="#F8E9D8" opacity=".6"/>
      <g stroke="#7A5B44" stroke-width="2" fill="none" opacity=".55">
        <path d="M140 95c10-20 30-20 40 0s30 20 40 0"/>
        <circle cx="150" cy="60" r="14"/>
        <circle cx="250" cy="60" r="14"/>
      </g>
      <text x="200" y="80" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="20" fill="#3A2B1E">Feito à mão com amor</text>
    </svg>
  </div>

  <div class="at-search-wrap">
    <input type="text" id="searchInput" placeholder="Buscar produto...">
  </div>

  <main>
    <h2 class="at-cat-heading" id="catHeading">Todos</h2>
    <div id="products"></div>
  </main>

  <!-- MODAL PRODUTO -->
  <div class="at-modal-bg" id="productModalBg">
    <div class="at-modal">
      <button class="at-close">&times;</button>
      <div id="productModalContent"></div>
    </div>
  </div>

  <!-- MODAL CARRINHO -->
  <div class="at-modal-bg" id="cartModalBg">
    <div class="at-modal">
      <button class="at-close">&times;</button>
      <h2>Seu carrinho</h2>
      <div id="cartItems"></div>
      <div id="cartFooter"></div>
    </div>
  </div>

</div>

  var WHATSAPP_NUMBER = "5582993492814";

  var state = { products: [], filter: "Todos", search: "", cart: [], galleryIndex: 0 };


  function money(v){ return "R$ " + Number(v||0).toFixed(2).replace(".", ","); }
  function escapeHtml(s){ var d = document.createElement("div"); d.textContent = s || ""; return d.innerHTML; }

  function loadCart(){
    try {
      var raw = localStorage.getItem("at_cart");
      state.cart = raw ? JSON.parse(raw) : [];
    } catch(e){ state.cart = []; }
  }
  function saveCart(){
    try { localStorage.setItem("at_cart", JSON.stringify(state.cart)); } catch(e){}
  }

  /* ---- CSV ---- */
  function splitCSVLine(line){
    var result = [], cur = "", inQuotes = false;
    for (var i=0;i<line.length;i++){
      var c = line[i];
      if (c === '"'){ inQuotes = !inQuotes; }
      else if (c === ',' && !inQuotes){ result.push(cur); cur = ""; }
      else { cur += c; }
    }
    result.push(cur);
    return result;
  }

  function parseCSV(text){
    var lines = text.split(/\r\n|\n/).filter(function(l){ return l.trim().length; });
    if (lines.length < 2) return [];
    var headers = splitCSVLine(lines[0]).map(function(h){ return h.trim().toLowerCase(); });
    return lines.slice(1).map(function(line, idx){
      var cols = splitCSVLine(line);
      var obj = {};
      headers.forEach(function(h,i){ obj[h] = (cols[i]||"").trim(); });
      return {
        id: "p" + idx,
        name: obj.nome || "",
        price: parseFloat((obj.preco||"0").replace(",",".")) || 0,
        category: obj.categoria || "",
        photo: obj.foto1 || "",
        photo2: obj.foto2 || ""
      };
    }).filter(function(p){ return p.name; });
  }

  function loadProducts(){
    if (!SHEET_CSV_URL){
      state.products = SAMPLE_PRODUCTS;
      renderProducts();
      return;
    }
    fetch(SHEET_CSV_URL).then(function(r){ return r.text(); }).then(function(text){
      var parsed = parseCSV(text);
      state.products = parsed.length ? parsed : SAMPLE_PRODUCTS;
      renderProducts();
    }).catch(function(){
      state.products = SAMPLE_PRODUCTS;
      renderProducts();
    });
  }

  /* ---- RENDER PRODUCTS ---- */
  function renderProducts(){
    var wrap = document.getElementById("products");
    var list = state.products.filter(function(p){
      var catOk = state.filter === "Todos" || p.category === state.filter;
      var s = state.search.trim().toLowerCase();
      var searchOk = !s || p.name.toLowerCase().indexOf(s) !== -1;
      return catOk && searchOk;
    });
    if (list.length === 0){
      wrap.innerHTML = '<div class="at-empty">Nenhum produto encontrado ainda.</div>';
      return;
    }
    wrap.innerHTML = list.map(function(p){
      return '<div class="at-card" data-id="'+p.id+'">'+
        '<div class="at-photo">'+(p.photo ? '<img src="'+p.photo+'">' : '')+'</div>'+
        '<h3>'+escapeHtml(p.name)+'</h3>'+
        '<div class="at-cat">'+escapeHtml(p.category)+'</div>'+
        '<div class="at-price">'+money(p.price)+'</div>'+
        '<button class="at-btn">Ver detalhes</button>'+
      '</div>';
    }).join("");
    wrap.querySelectorAll(".at-card").forEach(function(card){
      var id = card.getAttribute("data-id");
      card.querySelector(".at-btn").addEventListener("click", function(){
        openProduct(id);
      });
    });
  }

  function openProduct(id){
    var p = state.products.find(function(x){ return x.id === id; });
    if (!p) return;
    state.galleryIndex = 0;
    renderProductModal(p);
    showModal("productModalBg");
  }

  function renderProductModal(p){
    var photos = [p.photo, p.photo2].filter(Boolean);
    if (photos.length === 0) photos = [""];
    var current = photos[state.galleryIndex] || photos[0];
    var nav = photos.length > 1
      ? '<button class="at-gallery-nav prev" id="galPrev">&#8249;</button><button class="at-gallery-nav next" id="galNext">&#8250;</button>'
      : "";
    var thumbs = photos.length > 1
      ? '<div class="at-gallery-thumbs">' + photos.map(function(ph, i){
          return '<button data-i="'+i+'" class="'+(i===state.galleryIndex?'active':'')+'">'+(ph?'<img src="'+ph+'">':'')+'</button>';
        }).join('') + '</div>'
      : "";
    document.getElementById("productModalContent").innerHTML =
      '<div class="at-photo" style="margin-bottom:6px">'+(current ? '<img src="'+current+'">' : '')+nav+'</div>'+
      thumbs+
      '<h2 style="margin-top:14px">'+escapeHtml(p.name)+'</h2>'+
      '<div class="at-cat">'+escapeHtml(p.category)+'</div>'+
      '<div class="at-price" style="font-size:20px;margin:8px 0 16px">'+money(p.price)+'</div>'+
      '<button class="at-primary-btn" id="addToCartBtn">Adicionar ao carrinho</button>';
    document.getElementById("addToCartBtn").addEventListener("click", function(){
      addToCart(p, current);
      closeModals();
    });
    if (photos.length > 1){
      document.getElementById("galPrev").addEventListener("click", function(){
        state.galleryIndex = (state.galleryIndex - 1 + photos.length) % photos.length;
        renderProductModal(p);
      });
      document.getElementById("galNext").addEventListener("click", function(){
        state.galleryIndex = (state.galleryIndex + 1) % photos.length;
        renderProductModal(p);
      });
      document.querySelectorAll(".at-gallery-thumbs button").forEach(function(btn){
        btn.addEventListener("click", function(){
          state.galleryIndex = parseInt(btn.getAttribute("data-i"), 10);
          renderProductModal(p);
        });
      });
    }
  }

  function addToCart(p, photo){
    var existing = state.cart.find(function(i){ return i.id === p.id; });
    if (existing){ existing.qty += 1; }
    else { state.cart.push({ id:p.id, name:p.name, price:p.price, photo: photo || p.photo, qty:1 }); }
    saveCart();
    renderCartIcon();
  }

  function renderCartIcon(){
    var count = state.cart.reduce(function(s,i){ return s+i.qty; }, 0);
    var el = document.getElementById("cartCount");
    if (count > 0){ el.style.display = "flex"; el.textContent = count; }
    else { el.style.display = "none"; }
  }

  function renderCart(){
    var wrap = document.getElementById("cartItems");
    var footer = document.getElementById("cartFooter");
    if (state.cart.length === 0){
      wrap.innerHTML = '<div class="at-cart-empty">Seu carrinho está vazio.</div>';
      footer.innerHTML = "";
      return;
    }
    wrap.innerHTML = state.cart.map(function(i){
      return '<div class="at-cart-item" data-id="'+i.id+'">'+
        (i.photo ? '<img src="'+i.photo+'">' : '<div style="width:48px;height:48px"></div>')+
        '<div class="info"><div>'+escapeHtml(i.name)+' x'+i.qty+'</div><div>'+money(i.price*i.qty)+'</div></div>'+
        '<button class="at-remove">Remover</button>'+
      '</div>';
    }).join("");
    wrap.querySelectorAll(".at-cart-item").forEach(function(row){
      row.querySelector(".at-remove").addEventListener("click", function(){
        state.cart = state.cart.filter(function(i){ return i.id !== row.getAttribute("data-id"); });
        saveCart(); renderCart(); renderCartIcon();
      });
    });
    var total = state.cart.reduce(function(s,i){ return s + i.price*i.qty; }, 0);
    var msg = "Olá! Quero fazer este pedido:%0A" + state.cart.map(function(i){
      return "- " + i.name + " x" + i.qty + " (" + money(i.price*i.qty) + ")";
    }).join("%0A") + "%0A%0ATotal: " + money(total);
    var link = "https://wa.me/"+WHATSAPP_NUMBER+"?text="+msg;
    footer.innerHTML = '<div class="at-cart-total"><span>Total</span><span>'+money(total)+'</span></div>'+
      '<a class="at-wa-btn" href="'+link+'" target="_blank" rel="noopener">Finalizar pelo WhatsApp</a>';
  }

  function showModal(id){ document.getElementById(id).style.display = "flex"; }
  function closeModals(){
    document.querySelectorAll(".at-modal-bg").forEach(function(m){ m.style.display = "none"; });
  }

  /* ---- INIT ---- */
  function init(){
    loadCart();
    renderCartIcon();
    loadProducts();

    document.querySelectorAll(".at-menu button").forEach(function(btn){
      btn.addEventListener("click", function(){
        document.querySelectorAll(".at-menu button").forEach(function(b){ b.classList.remove("active"); });
        btn.classList.add("active");
        state.filter = btn.getAttribute("data-cat");
        document.getElementById("catHeading").textContent = state.filter;
        renderProducts();
      });
    });

    document.getElementById("searchInput").addEventListener("input", function(e){
      state.search = e.target.value;
      renderProducts();
    });

    document.getElementById("cartIconBtn").addEventListener("click", function(){
      renderCart();
      showModal("cartModalBg");
    });

    document.querySelectorAll(".at-close").forEach(function(btn){
      btn.addEventListener("click", closeModals);
    });
    document.querySelectorAll(".at-modal-bg").forEach(function(bg){
      bg.addEventListener("click", function(e){ if (e.target === bg) closeModals(); });
    });
  }

  if (document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }
})();
</script>
</body>
</html>
